            <script defer="" data-name="navigation-logic">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const mobileToggle = document.getElementById("mobile-toggle")
                  const mobileClose = document.getElementById("mobile-close")
                  const mobileOverlay = document.getElementById("mobile-overlay")
                  const navLinks = document.querySelectorAll(".navigation-mobile-link")

                  function openMenu() {
                    mobileOverlay.classList.add("is-active")
                    mobileToggle.setAttribute("aria-expanded", "true")
                    document.body.style.overflow = "hidden"
                  }

                  function closeMenu() {
                    mobileOverlay.classList.remove("is-active")
                    mobileToggle.setAttribute("aria-expanded", "false")
                    document.body.style.overflow = ""
                  }

                  mobileToggle.addEventListener("click", openMenu)
                  mobileClose.addEventListener("click", closeMenu)

                  navLinks.forEach((link) => {
                    link.addEventListener("click", closeMenu)
                  })

                  window.addEventListener("keydown", (e) => {
                    if (e.key === "Escape" && mobileOverlay.classList.contains("is-active")) {
                      closeMenu()
                    }
                  })

                  let lastScroll = 0
                  const nav = document.getElementById("navigation-main")

                  window.addEventListener("scroll", () => {
                    const currentScroll = window.pageYOffset

                    if (currentScroll <= 0) {
                      nav.style.transform = "translateY(0)"
                      return
                    }

                    if (currentScroll > lastScroll && !mobileOverlay.classList.contains("is-active")) {
                      nav.style.transform = "translateY(-100%)"
                    } else {
                      nav.style.transform = "translateY(0)"
                    }

                    lastScroll = currentScroll
                  })
                })()
              });
            </script>
          </div>
        </div>
